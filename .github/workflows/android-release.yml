name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag (vX.Y.Z); run this workflow from main'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate release tag before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Release tag must be vX.Y.Z' >&2; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]] || { echo 'Push ref does not match release tag' >&2; exit 1; }
          else
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]] || { echo 'Manual release must run from main' >&2; exit 1; }
          fi
      - name: Checkout workflow helpers from main for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Save workflow helper outside the checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          cp scripts/verify-android-release.sh "$RUNNER_TEMP/verify-android-release.sh"
          echo "VERIFY_SCRIPT=$RUNNER_TEMP/verify-android-release.sh" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate checked-out source and version
        shell: bash
        run: bash "${VERIFY_SCRIPT:-scripts/verify-android-release.sh}" source
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install dependencies, test, and typecheck
        run: |
          npm ci
          npm test
          npx tsc --noEmit
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Preserve unsigned build APK for diagnostics (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudreve-unsigned-build-${{ env.RELEASE_TAG }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 7
      - name: Sign APK and collect public diagnostics
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: bash "${VERIFY_SCRIPT:-scripts/verify-android-release.sh}" sign
      - name: Preserve public certificate and APK metadata diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudreve-public-diagnostics-${{ env.RELEASE_TAG }}
          path: |
            signer-details.txt
            apk-metadata.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Verify signing identity and APK version
        shell: bash
        run: bash "${VERIFY_SCRIPT:-scripts/verify-android-release.sh}" verify
      - name: Preserve validated signed APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudreve-android-${{ env.RELEASE_TAG }}
          path: |
            Cloudreve.apk
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" Cloudreve.apk SHA256SUMS --verify-tag --title "Cloudreve Android $RELEASE_TAG" --notes 'La nouvelle signature impose de désinstaller toute ancienne version avant installation. Cette version corrige la taille réelle des fichiers et les erreurs HTTP 200.'
